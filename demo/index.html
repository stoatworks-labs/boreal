  <body>
    <main id="demo">
      <noscript>
        <h1>Boreal</h1>
        <p>
          An FFGL source that's the night sky, and an effect that adds the
          aurora to your clip as light. The arc is a vortex sheet of electric
          charge that rolls itself up into curls, folds and surges, the
          electrons it speeds up light each spectral line at the height a real
          atmosphere puts it, and a camera on the ground looks up through the
          lot. There isn't a noise function anywhere in it.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/boreal">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/boreal/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/boreal">Source on GitHub</a></li>
        </ul>
